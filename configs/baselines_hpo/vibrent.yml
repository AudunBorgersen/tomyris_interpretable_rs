# Grid search for the baseline recommenders on the Vibrent rental dataset.
# Run: python baseline_models/grid_search.py --config configs/baselines_hpo/vibrent.yml
#
# Implicit feedback (a rental == a positive interaction); population reduced to the
# iterative k-core. Each model is fit on x_train and selected on x_val by
# `select_metric`; the held-out x_test metrics are reported at the selected config.

data:
  dataset: vibrent        # selects datasets.VibrentRental via datasets.get_dataset
  unit: group             # recommend catalogue groups (denser) | outfit = physical items
  k_core: 5               # iterative k-core threshold
  val_ratio: 0.1          # must be > 0 — selection happens on the validation users
  max_items: 0            # 0 = full catalogue (~4.7k outfits after k-core)

evaluation:
  ks: [1, 10, 50]  # cut-offs for Hit@k / NDCG@k / Novelty@k / Coverage@k
  select_metric: ndcg@10  # validation metric each model is tuned on

# Per-model grids. Keys are constructor kwargs, passed straight to the model.
# An empty grid ({}) means the model has nothing to tune and is evaluated once.
models:
  Random: {}
  Popularity: {}
  Item-kNN:
    k: [10, 20, 50, 100, 200]
  User-kNN:
    k: [10, 20, 50, 100, 200]
  SVD:
    n_factors: [16, 32, 64, 128, 256]
  DecisionTree:
    max_depth: [10, 20, 40]
    min_samples_leaf: [1, 5, 20]
  EASE:
    l2: [10, 50, 100, 250, 500, 1000]
  # Vibrent is much sparser than ML-1M (~0.6% density), so the same fractional
  # support mines far fewer rules — the support grid is lowered accordingly.
  # Widen it (or lower max_items) only when you can afford the runtime.
  Apriori:
    min_support: [0.01, 0.02, 0.05]
    min_confidence: [0.2, 0.4]
    max_len: [2]

output:
  latex: true
  latex_out: results/tex/baseline_hpo_results_vibrent.tex  # relative to repo root
