# Optuna HPO for coalesced_baseline — scaled-clauses sweep
# Run: python experiments/coalesced_hpo.py --config configs/coalesced_hpo/scaled.yml
#
# Designed from the 75 finished runs in tomyris-coalesced-3647cls:
#   - feature_negation / output_balancing / type_iii_feedback all hurt -> fixed off
#   - max_per_user is monotonic and still rising at 50 (uncapped=0 is worst)
#   - s has a clear negative correlation; old [1,20] range wasted half its trials
#   - T only matters relative to clauses (ratio ~1.25) -> sample t_per_clause, derive T
#   - rank metrics peak at epoch ~3-5 then decay -> short budget + best-epoch objective
#     (the objective optimizes best_ndcg@10, logged by coalesced_baseline.main())

study:
  study_name: coalesced-hpo-scaled
  n_trials: 60          # raised from 40: clause_drop_p + type_i_ii_ratio add 2 dims
  direction: maximize
  metric: ndcg@10
  # GPUs to devote to this sweep — one worker process per GPU, trials split
  # evenly (60 / N each). Edit to the free GPUs on the server. A single entry
  # (or omitting `gpus`) runs serially on that device. EDIT THESE.
  # NOTE: this is a CPU/launch-bound job (GPU ~4% util), so each worker's per-
  # example matvec competes for cores (capped to n_cores/N_workers). Fewer
  # workers = more cores each = faster per-run. 2 is a better speed/throughput
  # balance than 3 here; raise only if cores are plentiful relative to GPUs.
  gpus: [7]
  # Shared store so all workers coordinate one study (required for parallel GPUs).
  # Reusing the same file resumes/appends; delete it (or change study_name) to
  # start fresh. SQLite is fine for a handful of workers.
  storage: sqlite:///runs/coalesced_hpo/coalesced-hpo-scaled.db

fixed:
  epochs: 6
  max_classes: 0
  feature_negation: false
  output_balancing: false
  type_iii_feedback: false
  max_positive_clauses: 0
  # Capped at 50 (was searched over {50,75,100}). max_per_user is a LINEAR
  # multiplier on epoch time — the workload is per-example/launch-bound (GPU
  # ~4% util), not clause-bound — and NDCG gains above 50 are marginal. Fixing
  # it removes the single biggest time-sink from the search.
  max_per_user: 50
  mask_target_literal_p: 1.0
  subsample_mode: feedback  # subsample_mode: input | feedback

search_space:
  clauses:
    type: int
    low: 1000
    high: 4000
    step: 200
  t_per_clause:          # T is derived from this (see `derived` below)
    type: float
    low: 0.5
    high: 2.5
  s:
    type: float
    low: 3.5
    high: 20.0
  max_included_literals:
    type: int
    low: 4
    high: 12
  clause_drop_p:         # clause dropout — regularise the epoch ~4 peak-then-decay
    type: categorical
    choices: [0.0, 0.1, 0.25, 0.5]
  type_i_ii_ratio:       # >1 favours Type I (include), <1 favours Type II (exclude)
    type: float
    low: 0.5
    high: 2.0
  input_subsample_t:
    type: categorical
    choices: [0.0, 0.01, 0.05, 0.1, 0.15, 0.2]


# Params computed from sampled values. Evaluated in a no-builtins namespace
# exposing only round/min/max/int/float plus the sampled + fixed values.
derived:
  T: "round(clauses * t_per_clause)"

# Helper params used only to derive others; not passed to the experiment.
drop_from_args: [t_per_clause]
